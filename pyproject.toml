[project]
name = "red-facyt-api"
version = "0.1.0"
description = "API REST de Red FaCyT (monolito modular con FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=11.0",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "import-linter>=2.1",
    "httpx2>=2.13.1",
]

# --------------------------------------------------------------------------
# Ruff: lint + formato
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]  # Depends() en argumentos por defecto es el idioma de FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# --------------------------------------------------------------------------
# import-linter: reglas del monolito modular (ver docs/adr/0001-monolito-modular.md)
# --------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core no depende de ningún módulo de negocio"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.api", "app.main"]

[[tool.importlinter.contracts]]
name = "Dependencias entre módulos: moderation|sharing -> posts -> identity"
type = "layers"
layers = [
    "app.modules.moderation | app.modules.sharing",
    "app.modules.posts",
    "app.modules.identity",
]

[[tool.importlinter.contracts]]
name = "Los internos de identity son privados"
type = "forbidden"
source_modules = ["app.modules.posts", "app.modules.moderation", "app.modules.sharing"]
forbidden_modules = [
    "app.modules.identity.models",
    "app.modules.identity.repository",
    "app.modules.identity.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Los internos de posts son privados"
type = "forbidden"
source_modules = ["app.modules.identity", "app.modules.moderation", "app.modules.sharing"]
forbidden_modules = [
    "app.modules.posts.models",
    "app.modules.posts.repository",
    "app.modules.posts.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Los internos de moderation son privados"
type = "forbidden"
source_modules = ["app.modules.identity", "app.modules.posts", "app.modules.sharing"]
forbidden_modules = [
    "app.modules.moderation.models",
    "app.modules.moderation.repository",
    "app.modules.moderation.router",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Los internos de sharing son privados"
type = "forbidden"
source_modules = ["app.modules.identity", "app.modules.posts", "app.modules.moderation"]
forbidden_modules = [
    "app.modules.sharing.models",
    "app.modules.sharing.repository",
    "app.modules.sharing.router",
]
allow_indirect_imports = true
